<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glúteos de Aço</title>
  <meta name="description" content="Treinos em casa para 7 dias: glúteos, braços, corrida e mobilidade, em 45 minutos ou menos.">
  <meta name="theme-color" content="#e8505b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">GA</span>
      <div>
        <h1>Glúteos de Aço</h1>
        <p class="tag">Braços e glúteos fortes, em casa, em 45 min</p>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Secções">
    <button data-tab="hoje" class="active"><span>☀️</span>Hoje</button>
    <button data-tab="semana"><span>📅</span>Semana</button>
    <button data-tab="treinos"><span>📚</span>Treinos</button>
    <button data-tab="progresso"><span>📈</span>Progresso</button>
    <button data-tab="dicas"><span>💡</span>Dicas</button>
  </nav>

  <section id="workout" class="panel" hidden aria-modal="true" role="dialog"></section>

  <div id="interval" class="interval" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
