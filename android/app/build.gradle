plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.pedrobd.lembrame'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.pedrobd.lembrame'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }

    // A chave de assinatura não está no repositório em claro: o GitHub Actions desencripta
    // release.keystore.enc com o segredo KEYSTORE_PASSWORD antes de compilar.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'lembrame'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/webassets"] }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// A interface é a mesma da versão web (pasta lembretes/ na raiz do repositório).
tasks.register('copyWebApp', Copy) {
    from "$rootDir/../lembretes"
    include '*.html', '*.js', '*.css', '*.svg', 'fonts/*.woff2'
    exclude 'sw.js', 'downloads.html'
    into "$buildDir/generated/webassets/www"
}
preBuild.dependsOn 'copyWebApp'
