name: App Android (Lembra-me)

on:
  push:
    paths:
      - 'android/**'
      - 'lembretes/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar o APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Preparar ficheiro
        run: cp android/app/build/outputs/apk/release/app-release.apk Lembra-me.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lembra-me-apk
          path: Lembra-me.apk

      # Link fixo para descarregar no telemóvel:
      # https://github.com/<dono>/<repo>/releases/download/lembra-me/Lembra-me.apk
      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lembra-me --yes --cleanup-tag || true
          gh release create lembra-me Lembra-me.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Lembra-me (app Android)" \
            --notes "Lembretes falados que tocam mesmo com o ecrã desligado. Descarrega Lembra-me.apk no telemóvel e instala. Versão do commit ${GITHUB_SHA::7}."
